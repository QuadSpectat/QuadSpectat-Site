name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# The frontend (viewer, client pages, drone landing) is built and hosted by the shared DigitalOcean app
# (see QuadSpectat-Web/.do/app.yaml). This workflow only deploys the API to Fly.io.
concurrency:
  group: "backend"
  cancel-in-progress: true

jobs:

  # ── 2. Deploy backend to Fly.io ─────────────────────────────────────────────
  deploy-backend:
    name: Backend → Fly.io
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
