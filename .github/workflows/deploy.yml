name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:   # allow manual trigger from GitHub UI

jobs:
  deploy:
    name: Deploy to quadspectat.site
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # ── 1. Checkout ─────────────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 2. Build frontend ────────────────────────────────────────────────────
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: frontend
        env:
          # Same-origin deploy — no VITE_API_URL needed
          VITE_GOOGLE_MAPS_KEY: ${{ secrets.VITE_GOOGLE_MAPS_KEY }}
        run: pnpm build

      # ── 3. Deploy via SSH ────────────────────────────────────────────────────
      - name: Deploy to droplet
        uses: appleboy/ssh-action@v1
        with:
          host:     ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key:      ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd /opt/quadspectat

            echo "==> Pulling latest code"
            git pull origin main

            echo "==> Rebuilding & restarting backend"
            cd backend
            pnpm install --frozen-lockfile
            pnpm build
            pm2 restart quadspectat-backend || pm2 start dist/index.js --name quadspectat-backend
            cd ..

            echo "==> Copying frontend build"
            # frontend/dist was built on the runner and we copy it here
            # (see rsync step below — this step just restarts services)
            sudo cp -r /tmp/frontend-dist/* /var/www/quadspectat/

            echo "==> Done"

      # rsync built frontend dist to server before the SSH script runs
      - name: Upload frontend dist
        uses: appleboy/scp-action@v0.1.7
        with:
          host:     ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key:      ${{ secrets.DEPLOY_SSH_KEY }}
          source:   "frontend/dist/"
          target:   "/tmp/frontend-dist"
          strip_components: 2   # removes "frontend/dist" prefix
