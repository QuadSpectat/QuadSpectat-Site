# /etc/nginx/sites-available/quadspectat
# Symlink to sites-enabled: ln -s /etc/nginx/sites-available/quadspectat /etc/nginx/sites-enabled/

server {
    listen 80;
    listen [::]:80;
    server_name quadspectat.site www.quadspectat.site;

    # Certbot will add SSL redirect here automatically
    # Run: certbot --nginx -d quadspectat.site -d www.quadspectat.site
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name quadspectat.site www.quadspectat.site;

    # ── SSL (managed by Certbot) ────────────────────────────────────────────
    # ssl_certificate and ssl_certificate_key are injected by certbot
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    # ── Security headers ────────────────────────────────────────────────────
    add_header X-Frame-Options        SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy        strict-origin-when-cross-origin;

    # ── Frontend static files ───────────────────────────────────────────────
    root /var/www/quadspectat;
    index index.html;

    # Cache hashed assets (Vite outputs filenames with content hash)
    location ~* \.(js|css|woff2?|png|svg|ico|glb|gltf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Cesium static assets (large binary files)
    location /cesium/ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # SPA fallback — all non-file routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Backend API proxy ────────────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Large upload support (ECW / GLB / GeoTIFF files)
        client_max_body_size 2g;
        proxy_read_timeout   600s;
        proxy_send_timeout   600s;
        proxy_request_buffering off;
    }
}
